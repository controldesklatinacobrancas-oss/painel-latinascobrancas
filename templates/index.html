<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latina - Painel de Despausas</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #e8edf7; color: #1e3a6e;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .card {
            background: #ffffff; padding: 40px; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(30,58,110,0.08);
            border-top: 4px solid #e87a2f; text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        h1 span { color: #e87a2f; }
        p { color: #8a97ab; margin-bottom: 2rem; }
        ul { list-style: none; padding: 0; }
        li { margin: 1rem 0; }
        a {
            display: block; padding: 1rem 1.5rem; background-color: #eef2fa;
            color: #1e3a6e; text-decoration: none; border-radius: 10px;
            border-left: 4px solid #e87a2f; font-weight: 600;
            transition: all 0.15s ease;
        }
        a:hover { background-color: #1e3a6e; color: #fff; transform: translateX(5px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>LA<span>T</span>INA</h1>
        <p>Gestao em Cobrancas</p>
        <p>Selecione seu perfil:</p>
        <ul>
            {{ links | safe }}
        </ul>
    </div>
</body>
</html>
